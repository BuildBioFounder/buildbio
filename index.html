<style>
/* Built to the approved design canvas c8b5ba2d (ledger 1551):
   Main.dc.html (390x844 phone), VaultEntry.dc.html (revealed state),
   Desktop.dc.html (1440x900 two-column). */
:root{
  --orange:#E85D2C;--olive:#5C6B3A;--olive-light:#7A8C50;
  --black:#0D0D0D;--card:#1A1A1A;--border-l:#3A3A3A;
  --text:#fff;--muted:#B4B2A9;--dim:#6B6B6B;--green:#1D9E75;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--black);color:var(--text);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
a{color:var(--muted)}
a:hover{color:var(--text)}
input::placeholder{color:var(--dim)}

/* ---------- Phone: hero image top, content anchored bottom ---------- */
.stage{
  position:relative;min-height:100svh;overflow:hidden;background:var(--black);
  display:flex;flex-direction:column;justify-content:flex-end;
}
.hero{
  position:absolute;top:0;left:0;width:100%;height:60.5vh;
  object-fit:cover;object-position:center top;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.scrim{
  position:absolute;top:28vh;left:0;width:100%;height:34vh;
  background:linear-gradient(180deg,rgba(13,13,13,0) 0%,rgba(13,13,13,.85) 55%,var(--black) 100%);
  transition:top .25s ease,height .25s ease;
}
.stage.revealed .scrim{top:22vh;height:38vh;
  background:linear-gradient(180deg,rgba(13,13,13,0) 0%,rgba(13,13,13,.9) 55%,var(--black) 100%);}

.panel{
  position:relative;display:flex;flex-direction:column;gap:20px;
  padding:0 24px 28px;
}
.stage.revealed .panel{gap:16px}

.brand{display:flex;flex-direction:column;gap:6px;align-items:center}
.wordmark{
  font-family:var(--cond);font-weight:700;font-size:clamp(44px,14vw,56px);
  line-height:1;letter-spacing:.02em;text-transform:uppercase;
}
.wordmark .build{color:var(--orange)}
.wordmark .bio{color:var(--olive-light)}
.tagline{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:.01em}

.headline{
  font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.1;
  text-transform:uppercase;text-align:center;color:var(--text);
}
.stage.revealed .headline{display:none}

/* Waitlist — stacked on phone, per Main.dc.html */
.wl{display:flex;flex-direction:column;gap:10px}
.wl input[type=email]{
  width:100%;height:52px;padding:0 16px;background:var(--card);
  border:1px solid var(--border-l);border-radius:8px;color:var(--text);
  font-family:inherit;font-size:16px;
}
.wl input[type=email]:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
.wl button{
  width:100%;height:52px;background:var(--orange);color:#fff;border:none;border-radius:8px;
  font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.04em;
  text-transform:uppercase;cursor:pointer;
}
.wl button:hover{background:#d4501f}
.wl button:disabled{opacity:.55;cursor:default}
.wl-note{font-size:13px;color:var(--dim);text-align:center;min-height:19px}
.wl-note.good{color:var(--green)}
.wl-note.bad{color:var(--orange)}
/* Honeypot: off-screen, never announced, never tabbable. */
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}

/* Vault panel — injected at runtime only, styled per VaultEntry.dc.html */
#vault:empty{display:none}
#vault{
  display:flex;flex-direction:column;gap:8px;padding:14px;
  border:1px solid var(--olive);border-radius:8px;background:#121410;
}
#vault .vlabel{
  font-family:var(--cond);font-weight:600;font-size:16px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--olive-light);
}
#vault .vrow{display:flex;flex-direction:row;gap:8px}
#vault input{
  flex:1 1 auto;min-width:0;height:48px;padding:0 14px;background:var(--card);
  border:1px solid var(--border-l);border-radius:8px;color:var(--text);
  font-family:inherit;font-size:16px;
}
#vault input:focus{outline:2px solid var(--olive-light);outline-offset:1px;border-color:transparent}
#vault input.pin{letter-spacing:10px;text-align:center;font-size:20px}
#vault .vhint{font-size:12px;color:var(--dim)}

.legal{font-size:11px;color:var(--dim);text-align:center;line-height:1.5;padding-top:4px}
.legal a{color:var(--dim);text-decoration:underline}

/* ---------- Desktop: two-column split, per Desktop.dc.html ---------- */
@media (min-width:900px){
  .stage{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:center;justify-content:initial;height:100svh;
  }
  .hero{
    position:relative;width:100%;height:100svh;grid-column:1;
    object-position:center center;
  }
  .scrim{
    top:0;left:auto;right:50%;width:300px;height:100svh;
    transform:translateX(0);
    background:linear-gradient(90deg,rgba(13,13,13,0) 0%,var(--black) 100%);
  }
  .stage.revealed .scrim{top:0;height:100svh}
  .panel{
    grid-column:2;gap:28px;padding:0 clamp(40px,7vw,160px) 0 40px;max-width:560px;
  }
  .brand{align-items:flex-start}
  .wordmark{font-size:clamp(56px,6vw,88px)}
  .tagline{font-size:18px}
  .headline{font-size:34px;text-align:left}
  .wl{flex-direction:row;flex-wrap:wrap;gap:10px}
  .wl input[type=email]{flex:1 1 220px;height:56px;padding:0 18px}
  .wl button{width:auto;flex:0 0 auto;height:56px;padding:0 28px;white-space:nowrap}
  .wl-note{width:100%;text-align:left;font-size:13px}
  .legal{text-align:left;font-size:12px;padding-top:24px}
}

@media (prefers-reduced-motion:no-preference){
  .panel>*{animation:rise .5s ease both}
  .headline{animation-delay:.06s}.wl{animation-delay:.12s}.legal{animation-delay:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <img src="/images/bg/mechanical-b.jpg" alt="BuildBio" class="hero" id="bmark" draggable="false">
  <div class="scrim"></div>

  <div class="panel">
    <div class="brand">
      <div class="wordmark"><span class="build">Build</span><span class="bio">Bio</span></div>
      <div class="tagline">Your Aftermarket Blueprint.</div>
    </div>

    <p class="headline" id="headline">Coming soon. Be first on the list.</p>

    <form class="wl" id="wlForm" novalidate>
      <label for="wlEmail" class="hp">Email</label>
      <input type="email" id="wlEmail" name="email" placeholder="you@email.com"
             autocomplete="email" required aria-describedby="wlNote">
      <input type="text" class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="wlBtn">Join the waitlist</button>
      <p class="wl-note" id="wlNote" role="status" aria-live="polite">No spam. One email when the doors open.</p>
    </form>

    <div id="vault"></div>

    <p class="legal">
      BuildBio, operated by Blakeley King, incorporation pending.
      <a href="/privacy.html">Privacy</a>
    </p>
  </div>
</div>

<script>
/* ---------- Waitlist ---------- */
(function () {
  const form = document.getElementById('wlForm');
  const email = document.getElementById('wlEmail');
  const btn = document.getElementById('wlBtn');
  const note = document.getElementById('wlNote');

  function say(msg, cls) { note.textContent = msg; note.className = 'wl-note' + (cls ? ' ' + cls : ''); }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const value = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
      return say('That email does not look right.', 'bad');
    }
    btn.disabled = true;
    say('Adding you…');
    try {
      const res = await fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: value,
          company: form.company.value,        // honeypot
          referrer: document.referrer || null
        })
      });
      if (res.ok) {
        email.style.display = 'none';
        btn.style.display = 'none';
        say('You are on the list. Watch your inbox.', 'good');
      } else if (res.status === 429) {
        say('Too many tries. Give it a minute.', 'bad');
        btn.disabled = false;
      } else {
        say('Could not add you just now. Try again shortly.', 'bad');
        btn.disabled = false;
      }
    } catch (err) {
      say('Network trouble. Try again shortly.', 'bad');
      btn.disabled = false;
    }
  });
})();

/* ---------- Vault entry (founder ruling 2026-09-08, ledger 1551/1552) ----------
   Five taps on the B within 3 seconds injects the vault panel. Nothing about it
   exists in the served HTML, there is no URL parameter, no focusable element and
   no hint. A wrong password or 30 seconds idle removes it again. Correct password
   returns a single-use ~2-minute stage token, and only THEN is a 4-digit PIN
   field injected. PIN + token issues the 30-day cookie.                        */
(function () {
  const TAPS_NEEDED = 5, TAP_WINDOW_MS = 3000, IDLE_MS = 30000;
  const bmark = document.getElementById('bmark');
  const host = document.getElementById('vault');
  const stage = document.getElementById('stage');

  let taps = [], idleTimer = null, stageToken = null, mode = null;

  function teardown() {
    clearTimeout(idleTimer);
    host.innerHTML = '';
    stage.classList.remove('revealed');
    taps = []; stageToken = null; mode = null;
  }

  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(teardown, IDLE_MS);
  }

  function field(kind) {
    host.innerHTML = '';
    stage.classList.add('revealed');

    const label = document.createElement('div');
    label.className = 'vlabel';
    label.textContent = 'Vault access';

    const row = document.createElement('div');
    row.className = 'vrow';

    const input = document.createElement('input');
    input.type = 'password';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.placeholder = kind === 'pin' ? '••••' : 'Password';
    input.setAttribute('aria-label', kind === 'pin' ? 'PIN' : 'Password');
    if (kind === 'pin') {
      input.className = 'pin';
      input.inputMode = 'numeric';
      input.maxLength = 4;
    }

    const hint = document.createElement('div');
    hint.className = 'vhint';

    row.appendChild(input);
    host.appendChild(label);
    host.appendChild(row);
    host.appendChild(hint);
    input.focus();
    mode = kind;
    armIdle();
    return { input, row, hint };
  }

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    return { status: res.status, data };
  }

  function openPassword() {
    const { input, row } = field('password');

    const enter = document.createElement('button');
    enter.type = 'button';
    enter.textContent = 'Enter';
    enter.style.cssText =
      'height:48px;padding:0 18px;background:transparent;color:#7A8C50;' +
      'border:1px solid #5C6B3A;border-radius:8px;font-family:var(--cond);' +
      'font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer';
    row.appendChild(enter);

    async function submit() {
      const value = input.value;
      if (!value) return;
      input.value = '';
      input.disabled = true; enter.disabled = true;
      const { status, data } = await post('/api/vault-login', { password: value });
      if (status === 200 && data.stage) {
        stageToken = data.stage;
        return openPin();
      }
      // Any failure removes the panel entirely — no retry affordance, no signal.
      teardown();
    }

    input.addEventListener('input', armIdle);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    enter.addEventListener('click', submit);
  }

  function openPin() {
    const { input, hint } = field('pin');
    hint.textContent = 'Enter your 4-digit PIN.';
    input.addEventListener('input', function () {
      armIdle();
      if (input.value.length !== 4) return;
      submitPin(input);
    });
  }

  async function submitPin(input) {
    const pin = input.value;
    input.disabled = true;
    const { status, data } = await post('/api/vault-pin', { stage: stageToken, pin: pin });
    if (status === 200 && data.ok) {
      window.location.href = '/home.html';
      return;
    }
    if (data && data.reset) return teardown();   // token dead: start over silently
    input.value = '';
    input.disabled = false;
    input.focus();
    armIdle();
  }

  function tap() {
    const now = Date.now();
    taps = taps.filter(t => now - t < TAP_WINDOW_MS);
    taps.push(now);
    if (taps.length >= TAPS_NEEDED && !mode) {
      taps = [];
      openPassword();
    }
  }

  bmark.addEventListener('click', tap);
  bmark.addEventListener('dragstart', e => e.preventDefault());
})();
</script>

</body>
</html>
