<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>BuildBio - Vehicle Status Unavailable</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/favicon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #E85D2C; --olive-light: #7A8C50;
      --max: 640px; --black: #0D0D0D; --dark: #0D0D0D; --card: #1A1A1A; --border: #2E2E2E;
      --text: #fff; --muted: #B4B2A9; --dim: #6B6B6B;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV (shared-components §2 — verbatim from home.html) */
    [hidden]{display:none!important} /* .nl/.mob-menu a are inline-flex in the base block, which would beat the hidden attribute */
    .nav{position:fixed;top:0;left:0;right:0;z-index:200;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
    .logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.3px;line-height:1;text-decoration:none;display:flex;align-items:baseline}
    .logo .BL{font-size:28px;color:var(--orange)}.logo .rb{color:var(--orange)}.logo .BL2{font-size:28px;color:var(--olive-light)}.logo .rb2{color:var(--olive-light)}
    .nav-r{display:flex;align-items:center;gap:24px}
    .nl{color:var(--muted);font-size:13px;text-decoration:none;transition:color .15s}.nl:hover{color:var(--text)}
    .ncta{background:var(--orange);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:none;transition:opacity .15s,transform .1s;display:inline-flex;align-items:center}.ncta:hover{opacity:.88;transform:translateY(-1px)}
    /* HAMBURGER MENU */
    .ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:11px;margin-right:-10px;z-index:301;background:none;border:none;-webkit-appearance:none;appearance:none}
    .ham span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:transform .3s,opacity .3s}
    .ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .ham.open span:nth-child(2){opacity:0}
    .ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mob-menu{position:fixed;inset:0;z-index:300;background:linear-gradient(to bottom,#E85D2C,#5C6B3A);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:0;pointer-events:none;transition:opacity .3s}
    .mob-menu.open{opacity:1;pointer-events:auto}
    .mob-menu a{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;color:#fff;text-decoration:none;padding:16px 0;letter-spacing:.04em;transition:opacity .15s}
    .mob-menu a:hover{opacity:.8}
    .mob-menu .mob-cta{margin-top:20px;background:rgba(0,0,0,.25);padding:16px 40px;border-radius:12px;font-size:22px}

    /* MICRO-FOOTER (shared-components §3 — app page) */
    .mfoot{max-width:var(--max,1160px);margin:32px auto 0;padding:18px 28px;border-top:1px solid var(--border);display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim,#6B6B6B)}
    .mfoot a{color:var(--muted,#B4B2A9);text-decoration:none;padding:12px 0;display:inline-flex;align-items:center}
    .mfoot a:hover{color:var(--text,#fff)}
    @media(max-width:640px){.mfoot{padding:16px}}

    /* TYPE WEIGHTS (shared-components §5 — only Barlow 600/700 + DM Sans 400/500 exist) */
    strong{font-weight:500}
    h3{font-family:'Barlow Condensed',sans-serif;font-weight:700}

    /* LINE-SETTING layer 1 (shared-components §7 / Typography Law §2) */
    h1,h2,h3,.h1,.eyebrow,.page-title{text-wrap:balance}
    p,li,.hint,.blurb,.sub,.lead,.page-sub,.qr-hint,.empty-state{text-wrap:pretty}

    .main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 88px 28px 40px; text-align: center;
    }
    .msg-box {
      max-width: 480px; width: 100%;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 48px 32px;
    }
    .msg-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(232,93,44,0.1); border: 1px solid rgba(232,93,44,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 24px; color: var(--orange);
    }
    .msg-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px; font-weight: 700; text-transform: uppercase;
      margin-bottom: 12px; letter-spacing: 0.3px;
    }
    .msg-body {
      font-size: 15px; color: var(--muted); line-height: 1.7;
      margin-bottom: 28px;
    }
    .home-link {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--orange); color: #fff; border: none;
      padding: 12px 28px; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      text-decoration: none; transition: opacity 0.15s, transform 0.1s;
    }
    .home-link:hover { opacity: 0.88; transform: translateY(-1px); }

    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .nav-r .nl { display: none; }
      .nav-r .ncta { display: none; }
      .ham { display: flex; }
      .ncta { padding: 12px 16px; font-size: 13px; min-height: 44px; }
      .main { padding: 88px 16px 40px; }
      .msg-box { padding: 36px 20px; }
    }
  
    /* ── Mobile-first base (founder standard 2026-08-16) ──────────────────
       Appended last so it wins the cascade. */
    body { font-size: 16px; }
    input, select, textarea { font-size: 16px !important; }
    img { max-width: 100%; height: auto; }
    .btn, .mod-btn, button, select { min-height: 44px; }
    .nav .logo { padding: 8px 0; }                 /* 28px wordmark -> 44px tap height */
    .footer .fl2 { padding: 7px 0; display: inline-flex; align-items: baseline; }
    a.nl, a.flink, .mfoot a { min-height: 44px; display: inline-flex; align-items: center; }
  </style>
</head>

</div>

<script>
function toggleMenu(){var h=document.querySelector('.ham'),m=document.getElementById('mobMenu');var o=m.classList.toggle('open');h.classList.toggle('open',o);h.setAttribute('aria-expanded',o?'true':'false');document.body.style.overflow=o?'hidden':''}
document.querySelectorAll('#mobMenu a').forEach(function(a){a.addEventListener('click',function(){var h=document.querySelector('.ham'),m=document.getElementById('mobMenu');h.classList.remove('open');h.setAttribute('aria-expanded','false');m.classList.remove('open');document.body.style.overflow=''})});

/* ---------- SITE TYPOGRAPHY RULE: no stranded sentence openings ----------
   Founder rule 2026-09-10, from a real case on the live page: the sentence
   "Every mod, every part..." began at the end of a line with only the word
   "Every" fitting, and the rest ran on below. A sentence must never start a
   line-end with fewer than three of its words; the fragment moves down whole.

   Mechanism: bind the first three words of every sentence after the first
   with non-breaking spaces. The space BEFORE the sentence stays breakable, so
   if all three do not fit, all three wrap together and nothing is stranded.
   Layout-independent — no re-run needed on resize, and no reflow cost.

   Guard: skipped when those three words exceed 26 characters, since forcing a
   long group onto one line could overflow a narrow phone. Wrapping ugly beats
   overflowing.                                                              */
(function () {
  const MIN_WORDS = 3, MAX_CHARS = 26;

  function typeset(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);

    // Flatten to one string, remembering which node/offset each char came from,
    // so inline markup (<strong>, <a>) survives untouched.
    let full = '';
    const map = [];
    for (const nd of nodes) {
      for (let i = 0; i < nd.textContent.length; i++) map.push({ node: nd, offset: i });
      full += nd.textContent;
    }

    const bind = [];
    const boundary = /[.!?]["')\]]?\s+/g;
    let m;
    while ((m = boundary.exec(full))) {
      let cursor = m.index + m[0].length;      // first char of the next sentence
      if (cursor >= full.length) continue;

      const spaces = [];
      let words = 0, chars = 0, ended = false;
      while (cursor < full.length && words < MIN_WORDS) {
        const start = cursor;
        while (cursor < full.length && !/\s/.test(full[cursor])) cursor++;
        chars += cursor - start;
        words++;
        // Never bind across a sentence end. Fix 2026-09-22: back-to-back short
        // sentences ("What suspension? What bumper? What light bar") chained
        // their bindings into one unbreakable run that overflowed a phone.
        if (/[.!?]["')\]]?$/.test(full.slice(start, cursor))) { ended = true; break; }
        if (words < MIN_WORDS) {
          if (full[cursor] === ' ') { spaces.push(cursor); chars++; cursor++; }
          else break;                          // ran out of sentence
        }
      }
      if ((words === MIN_WORDS || ended) && spaces.length && chars <= MAX_CHARS) bind.push(...spaces);
    }

    // One char replaced by one char, so recorded offsets stay valid.
    const NBSP = String.fromCharCode(160);   // explicit: an invisible literal is fragile
    for (const i of bind) {
      const { node, offset } = map[i];
      const t = node.textContent;
      node.textContent = t.slice(0, offset) + NBSP + t.slice(offset + 1);
    }
  }

  document.querySelectorAll('p, li, .hint, .sub, .lead, .qr-hint, .empty-state, .msg-body').forEach(typeset);
})();
</script>
