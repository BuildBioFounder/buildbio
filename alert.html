<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>BuildBio - Stolen Vehicle Alert</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/favicon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #E85D2C; --olive-light: #7A8C50;
      --max: 640px; --black: #0D0D0D; --dark: #0D0D0D; --dark-2: #161616; --card: #1A1A1A;
      --border: #2E2E2E; --border-l: #3A3A3A;
      --text: #fff; --muted: #B4B2A9; --dim: #6B6B6B;
      --green: #1D9E75; --red: #E24B4A; --blue: #378ADD;
      --alert-red: #C0392B; --alert-orange: #D35400; --alert-amber: #B8860B; --alert-gray: #555;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      padding-top: 58px;
      padding-bottom: 40px;
    }

    /* NAV (shared-components §2 — verbatim from home.html) */
    [hidden]{display:none!important} /* .nl/.mob-menu a are inline-flex in the base block, which would beat the hidden attribute */
    .nav{position:fixed;top:0;left:0;right:0;z-index:200;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
    .logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.3px;line-height:1;text-decoration:none;display:flex;align-items:baseline}
    .logo .BL{font-size:28px;color:var(--orange)}.logo .rb{color:var(--orange)}.logo .BL2{font-size:28px;color:var(--olive-light)}.logo .rb2{color:var(--olive-light)}
    .nav-r{display:flex;align-items:center;gap:24px}
    .nl{color:var(--muted);font-size:13px;text-decoration:none;transition:color .15s}.nl:hover{color:var(--text)}
    .ncta{background:var(--orange);color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:none;transition:opacity .15s,transform .1s;display:inline-flex;align-items:center}.ncta:hover{opacity:.88;transform:translateY(-1px)}
    /* HAMBURGER MENU */
    .ham{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:11px;margin-right:-10px;z-index:301;background:none;border:none;-webkit-appearance:none;appearance:none}
    .ham span{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:transform .3s,opacity .3s}
    .ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .ham.open span:nth-child(2){opacity:0}
    .ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mob-menu{position:fixed;inset:0;z-index:300;background:linear-gradient(to bottom,#E85D2C,#5C6B3A);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:0;pointer-events:none;transition:opacity .3s}
    .mob-menu.open{opacity:1;pointer-events:auto}
    .mob-menu a{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;color:#fff;text-decoration:none;padding:16px 0;letter-spacing:.04em;transition:opacity .15s}
    .mob-menu a:hover{opacity:.8}
    .mob-menu .mob-cta{margin-top:20px;background:rgba(0,0,0,.25);padding:16px 40px;border-radius:12px;font-size:22px}

    /* MICRO-FOOTER (shared-components §3 — app page) */
    .mfoot{max-width:var(--max,1160px);margin:32px auto 0;padding:18px 28px;border-top:1px solid var(--border);display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim,#6B6B6B)}
    .mfoot a{color:var(--muted,#B4B2A9);text-decoration:none;padding:12px 0;display:inline-flex;align-items:center}
    .mfoot a:hover{color:var(--text,#fff)}
    @media(max-width:640px){.mfoot{padding:16px}}

    /* TYPE WEIGHTS (shared-components §5 — only Barlow 600/700 + DM Sans 400/500 exist) */
    strong{font-weight:500}
    h3{font-family:'Barlow Condensed',sans-serif;font-weight:700}

    /* LINE-SETTING layer 1 (shared-components §7 / Typography Law §2) */
    h1,h2,h3,.h1,.eyebrow,.page-title{text-wrap:balance}
    p,li,.hint,.blurb,.sub,.lead,.page-sub,.qr-hint,.empty-state{text-wrap:pretty}

    /* LAYOUT */
    .container { max-width: 640px; margin: 0 auto; padding: 0 20px; }

    /* ALERT BANNER */
    .alert-banner {
      padding: 18px 20px; text-align: center;
      font-family: 'Barlow Condensed', sans-serif;
    }
    .alert-banner-title {
      font-size: 28px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #fff; margin-bottom: 4px;
    }
    .alert-banner-age {
      font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.85);
      font-family: 'DM Sans', sans-serif;
    }
    .alert-banner.age-red { background: var(--alert-red); }
    .alert-banner.age-orange { background: var(--alert-orange); }
    .alert-banner.age-amber { background: var(--alert-amber); }
    .alert-banner.age-gray { background: var(--alert-gray); }

    /* VEHICLE PHOTO */
    .vehicle-photo {
      width: 100%; aspect-ratio: 16/10; background: var(--card);
      border: 1px solid var(--border-l); border-radius: 12px;
      overflow: hidden; margin: 20px 0; display: flex;
      align-items: center; justify-content: center;
    }
    .vehicle-photo img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .vehicle-photo-placeholder {
      color: var(--dim); font-size: 14px; text-align: center; padding: 20px;
    }

    /* VEHICLE INFO */
    .info-section {
      background: var(--card); border: 1px solid var(--border-l);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .info-section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--olive-light); margin-bottom: 12px;
    }
    .vehicle-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.3px; line-height: 1.1; margin-bottom: 12px;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 13px; color: var(--dim); text-transform: uppercase;
      letter-spacing: 0.05em; font-weight: 500;
    }
    .info-value { font-size: 14px; color: var(--text); font-weight: 500; text-align: right; }

    /* STATUS BADGE */
    .status-badge {
      display: inline-block; font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 12px; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-owner-reported {
      background: rgba(232,93,44,0.15); color: var(--orange);
    }
    .status-verified {
      background: rgba(29,158,117,0.15); color: var(--green);
    }

    /* 911 CTA */
    .cta-section {
      background: var(--card); border: 1px solid var(--border-l);
      border-radius: 12px; padding: 28px 20px; margin-bottom: 16px;
      text-align: center;
    }
    .cta-911 {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 10px; width: 100%; max-width: 360px;
      background: var(--alert-red); color: #fff; border: none;
      padding: 18px 32px; border-radius: 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 24px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; text-decoration: none;
      transition: opacity 0.15s, transform 0.1s;
    }
    .cta-911:hover { opacity: 0.9; transform: translateY(-1px); }
    .cta-text {
      font-size: 15px; color: var(--muted); margin-top: 14px;
      line-height: 1.6;
    }
    .safety-warning {
      font-size: 13px; font-weight: 500; color: var(--alert-red);
      margin-top: 16px; padding: 14px; line-height: 1.5;
      background: rgba(192,57,43,0.08);
      border: 1px solid rgba(192,57,43,0.25);
      border-radius: 8px; text-transform: uppercase;
    }

    /* SIGHTING FORM */
    .sighting-section {
      background: var(--card); border: 1px solid var(--border-l);
      border-radius: 12px; padding: 24px 20px; margin-bottom: 16px;
    }
    .sighting-login-prompt {
      text-align: center; padding: 12px 0;
    }
    .sighting-login-prompt p {
      font-size: 14px; color: var(--muted); margin-bottom: 12px;
    }
    .sighting-login-prompt a {
      color: var(--orange); text-decoration: none; font-weight: 500;
    }
    .sighting-login-prompt a:hover { text-decoration: underline; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 6px;
    }
    .field input[type="text"], .field textarea, .field select {
      width: 100%; padding: 12px 14px;
      background: var(--dark-2); border: 1px solid var(--border-l);
      border-radius: 10px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      transition: border-color 0.2s; outline: none;
    }
    .field input[type="text"]::placeholder,
    .field textarea::placeholder { color: #555; }
    .field input[type="text"]:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(232,93,44,0.1);
    }
    .field textarea { resize: vertical; min-height: 80px; }
    .field select { cursor: pointer; }
    .field select option { background: var(--dark-2); color: var(--text); }
    .checkbox-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--orange);
      cursor: pointer; flex-shrink: 0;
    }
    .checkbox-row span { font-size: 14px; color: var(--muted); }
    .char-count {
      font-size: 11px; color: var(--dim); text-align: right; margin-top: 4px;
    }
    .btn-submit {
      display: block; width: 100%; text-align: center;
      padding: 14px; border-radius: 8px;
      background: var(--orange); color: #fff; border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* MESSAGES */
    .msg {
      padding: 12px 14px; border-radius: 8px; font-size: 13px;
      line-height: 1.5; margin-bottom: 16px; display: none;
    }
    .msg.error {
      background: rgba(224,85,85,0.12); border: 1px solid rgba(224,85,85,0.3);
      color: #f07070;
    }
    .msg.success {
      background: rgba(92,107,58,0.2); border: 1px solid rgba(92,107,58,0.4);
      color: #a8c070;
    }
    .msg.show { display: block; }

    /* STATES */
    .loading-state {
      text-align: center; padding: 80px 20px;
      color: var(--muted); font-size: 15px;
    }
    .inactive-state {
      text-align: center; padding: 80px 20px;
    }
    .inactive-state p {
      color: var(--muted); font-size: 15px; margin-bottom: 20px;
    }
    .inactive-state a {
      display: inline-flex; align-items: center;
      background: var(--orange); color: #fff; border: none;
      padding: 12px 28px; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
      text-decoration: none; transition: opacity 0.15s;
    }
    .inactive-state a:hover { opacity: 0.88; }

    @media (max-width: 640px) {
      .nav { padding: 0 16px; }
      .nav-r .nl { display: none; }
      .nav-r .ncta { display: none; }
      .ham { display: flex; }
      .ncta { padding: 12px 16px; font-size: 13px; min-height: 44px; }
      .container { padding: 0 16px; }
      .alert-banner-title { font-size: 22px; }
      .vehicle-title { font-size: 22px; }
      .cta-911 { font-size: 20px; padding: 16px 24px; }
    }
  
    /* ── Mobile-first base (founder standard 2026-08-16) ──────────────────
       Appended last so it wins the cascade. */
    body { font-size: 16px; }
    input, select, textarea { font-size: 16px !important; }
    img { max-width: 100%; height: auto; }
    .btn, .mod-btn, button, select { min-height: 44px; }
    .nav .logo { padding: 8px 0; }                 /* 28px wordmark -> 44px tap height */
    .footer .fl2 { padding: 7px 0; display: inline-flex; align-items: baseline; }
    a.nl, a.flink, .mfoot a { min-height: 44px; display: inline-flex; align-items: center; }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="logo"><span class="BL">B</span><span class="rb">UILD</span><span class="BL2">B</span><span class="rb2">IO</span></a>
  <div class="nav-r">
    <a href="/how-it-works.html" class="nl">How it works</a>
    <a href="/home.html#features" class="nl">Features</a>
    <a href="/pricing.html" class="nl">Pricing</a>
    <a href="/login.html" class="nl" id="nav-login">Log in</a>
    <a href="/signup.html" class="ncta" id="nav-cta">Create Your Free Profile</a>
    <button type="button" class="ham" aria-label="Menu" aria-expanded="false" onclick="toggleMenu()"><span></span><span></span><span></span></button>
  </div>
</nav>
<div class="mob-menu" id="mobMenu">
  <a href="/how-it-works.html">How It Works</a>
  <a href="/home.html#features">Features</a>
  <a href="/pricing.html">Pricing</a>
  <a href="/login.html" id="nav-login-m">Log In</a>
  <a href="/signup.html" class="mob-cta" id="nav-cta-m">Create Your Free Profile</a>
</div>

<div id="content">
  <div class="loading-state">Loading alert...</div>
</div>

<footer class="mfoot">
  <span>&copy; 2026 BuildBio</span>
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL  = 'https://bicmwjtkncjkguumbidq.supabase.co';
const SUPABASE_ANON = 'sb_publishable_vt_RE80rfii-6Pb6wtPLhA_t_hyYiTE';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const params = new URLSearchParams(window.location.search);
const vehicleId = params.get('vid');

function getAlertAge(reportedAt) {
  const now = new Date();
  const reported = new Date(reportedAt);
  const diffMs = now - reported;
  const diffHours = diffMs / (1000 * 60 * 60);
  const diffDays = diffMs / (1000 * 60 * 60 * 24);

  let ageClass, ageText;

  if (diffHours < 1) {
    ageClass = 'age-red';
    const mins = Math.max(1, Math.floor(diffMs / (1000 * 60)));
    ageText = 'Reported ' + mins + ' minute' + (mins !== 1 ? 's' : '') + ' ago';
  } else if (diffHours < 24) {
    ageClass = 'age-red';
    const hrs = Math.floor(diffHours);
    ageText = 'Reported ' + hrs + ' hour' + (hrs !== 1 ? 's' : '') + ' ago';
  } else if (diffDays < 3) {
    ageClass = 'age-orange';
    const days = Math.floor(diffDays);
    ageText = 'Reported ' + days + ' day' + (days !== 1 ? 's' : '') + ' ago';
  } else if (diffDays < 7) {
    ageClass = 'age-amber';
    const days = Math.floor(diffDays);
    ageText = 'Reported ' + days + ' days ago';
  } else {
    ageClass = 'age-gray';
    const days = Math.floor(diffDays);
    ageText = 'Reported ' + days + ' days ago (still missing)';
  }

  return { ageClass, ageText };
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// XSS hardening (ChatGPT-audit G-03): DB-sourced URLs must be http(s) — blocks javascript: etc.
function safeUrl(u){try{const p=new URL(String(u??''),location.origin);return ['http:','https:'].includes(p.protocol)?p.href:'#'}catch{return '#'}}

(async () => {
  if (!vehicleId) {
    document.getElementById('content').innerHTML =
      '<div class="inactive-state"><p>No vehicle specified.</p><a href="/">Return Home</a></div>';
    return;
  }

  // Check session for nav state
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    document.getElementById('nav-login').textContent = 'Account';
    document.getElementById('nav-login').href = '/account.html';
    document.getElementById('nav-login-m').textContent = 'Account';
    document.getElementById('nav-login-m').href = '/account.html';
  }

  // Fetch alert data
  const { data: alert, error } = await sb.rpc('get_active_bolo_alert_public', { p_vehicle_id: vehicleId });

  if (error || !alert || (Array.isArray(alert) && alert.length === 0)) {
    document.getElementById('content').innerHTML =
      '<div class="inactive-state"><p>This alert is no longer active or does not exist.</p><a href="/">Return Home</a></div>';
    return;
  }

  // RPC may return an array or single object
  const a = Array.isArray(alert) ? alert[0] : alert;
  if (!a) {
    document.getElementById('content').innerHTML =
      '<div class="inactive-state"><p>This alert is no longer active or does not exist.</p><a href="/">Return Home</a></div>';
    return;
  }

  const { ageClass, ageText } = getAlertAge(a.reported_at);
  const vehicleName = [a.year, a.make, a.model].filter(Boolean).join(' ');
  const statusLabel = a.report_status === 'verified' ? 'Verified' : 'Owner-Reported';
  const statusClass = a.report_status === 'verified' ? 'status-verified' : 'status-owner-reported';

  let photoHtml = '';
  if (a.primary_photo_url) {
    photoHtml = '<div class="vehicle-photo"><img src="' + escapeHtml(safeUrl(a.primary_photo_url)) + '" alt="Vehicle photo"></div>';
  } else {
    photoHtml = '<div class="vehicle-photo"><div class="vehicle-photo-placeholder">No photo available</div></div>';
  }

  // Vehicle info section
  let infoRows = '';
  if (a.color) {
    infoRows += '<div class="info-row"><span class="info-label">Color</span><span class="info-value">' + escapeHtml(a.color) + '</span></div>';
  }
  if (a.plate_number) {
    infoRows += '<div class="info-row"><span class="info-label">Plate</span><span class="info-value">' + escapeHtml(a.plate_number) + (a.plate_state ? ' (' + escapeHtml(a.plate_state) + ')' : '') + '</span></div>';
  }

  // Visible modifications
  let modsHtml = '';
  if (a.visible_modifications_description) {
    modsHtml = '<div class="info-section"><div class="info-section-title">Visible Modifications</div><p style="font-size:14px;color:var(--muted);line-height:1.7">' + escapeHtml(a.visible_modifications_description) + '</p></div>';
  }

  // Last seen
  let lastSeenHtml = '';
  if (a.last_seen_location) {
    lastSeenHtml = '<div class="info-section"><div class="info-section-title">Last Seen Near</div><p style="font-size:14px;color:var(--text);font-weight:500">' + escapeHtml(a.last_seen_location) + '</p></div>';
  }

  // Law enforcement
  let lawHtml = '';
  const lawRows = [];
  if (a.agency) lawRows.push('<div class="info-row"><span class="info-label">Agency</span><span class="info-value">' + escapeHtml(a.agency) + '</span></div>');
  if (a.jurisdiction) lawRows.push('<div class="info-row"><span class="info-label">Jurisdiction</span><span class="info-value">' + escapeHtml(a.jurisdiction) + '</span></div>');
  if (a.report_number) lawRows.push('<div class="info-row"><span class="info-label">Report #</span><span class="info-value">' + escapeHtml(a.report_number) + '</span></div>');
  if (lawRows.length > 0) {
    lawHtml = '<div class="info-section"><div class="info-section-title">Law Enforcement</div>' + lawRows.join('') + '</div>';
  }

  // Report status section
  let statusHtml = '<div class="info-section"><div class="info-section-title">Report Status</div>';
  statusHtml += '<div class="info-row"><span class="info-label">Status</span><span class="info-value"><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></span></div>';
  statusHtml += '<div class="info-row"><span class="info-label">Report Age</span><span class="info-value">' + escapeHtml(ageText.replace('Reported ', '')) + '</span></div>';
  statusHtml += '</div>';

  // Sighting section
  let sightingHtml = '';
  if (session) {
    sightingHtml = `
      <div class="sighting-section">
        <div class="info-section-title">Submit a Sighting Report</div>
        <div class="msg" id="sighting-msg"></div>
        <form id="sighting-form">
          <div class="field">
            <label for="sight-location">Where did you see this vehicle?</label>
            <input type="text" id="sight-location" placeholder="Cross streets, parking lot, city area..." required>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="sight-visible">
            <span>The vehicle is currently visible at this location</span>
          </label>
          <div class="field" style="margin-top:12px">
            <label for="sight-confidence">Confidence Level</label>
            <select id="sight-confidence">
              <option value="low">Low - Might be the vehicle</option>
              <option value="medium" selected>Medium - Fairly confident</option>
              <option value="high">High - Very confident it is the vehicle</option>
            </select>
          </div>
          <div class="field">
            <label for="sight-notes">Additional Notes</label>
            <textarea id="sight-notes" placeholder="Any details that might help (direction of travel, occupants, condition...)" maxlength="500"></textarea>
            <div class="char-count"><span id="sight-notes-count">0</span>/500</div>
          </div>
          <button type="submit" class="btn-submit" id="sight-submit">Submit Sighting Report</button>
        </form>
      </div>`;
  } else {
    sightingHtml = `
      <div class="sighting-section">
        <div class="info-section-title">Submit a Sighting Report</div>
        <div class="sighting-login-prompt">
          <p>Have you seen this vehicle? Log in to submit a sighting report.</p>
          <a href="/login.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}">Log in to report a sighting</a>
        </div>
      </div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="alert-banner ${ageClass}">
      <div class="alert-banner-title">Stolen Vehicle Alert</div>
      <div class="alert-banner-age">${escapeHtml(ageText)}</div>
    </div>
    <div class="container">
      ${photoHtml}
      <div class="info-section">
        <div class="info-section-title">Vehicle Information</div>
        <div class="vehicle-title">${escapeHtml(vehicleName)}</div>
        ${infoRows}
      </div>
      ${modsHtml}
      ${lastSeenHtml}
      ${lawHtml}
      ${statusHtml}
      <div class="cta-section">
        <a href="tel:911" class="cta-911">Call 911</a>
        <p class="cta-text">If you see this vehicle, call 911 immediately.</p>
        <div class="safety-warning">Do not follow, block, approach or confront the vehicle or its occupants.</div>
      </div>
      ${sightingHtml}
    </div>`;
  if (window.bbTypeset) window.bbTypeset(document.getElementById('content'));   // prose rendered after parse (sweep note B5)

  // Sighting form handlers (only if logged in)
  if (session) {
    const notesField = document.getElementById('sight-notes');
    const notesCount = document.getElementById('sight-notes-count');
    if (notesField && notesCount) {
      notesField.addEventListener('input', function() {
        notesCount.textContent = this.value.length;
      });
    }

    const sightingForm = document.getElementById('sighting-form');
    if (sightingForm) {
      sightingForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('sight-submit');
        const msgEl = document.getElementById('sighting-msg');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        const location = document.getElementById('sight-location').value.trim();
        if (!location) {
          msgEl.textContent = 'Please enter a location.';
          msgEl.className = 'msg error show';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Sighting Report';
          return;
        }

        const { error: insertErr } = await sb.from('bolo_sightings').insert({
          bolo_report_id: a.id,
          reporter_user_id: session.user.id,
          location_description: location,
          vehicle_currently_visible: document.getElementById('sight-visible').checked,
          confidence_level: document.getElementById('sight-confidence').value,
          notes: document.getElementById('sight-notes').value.trim() || null
        });

        if (insertErr) {
          msgEl.textContent = 'Error submitting report: ' + insertErr.message;
          msgEl.className = 'msg error show';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Sighting Report';
          return;
        }

        msgEl.textContent = 'Sighting report submitted. Thank you for helping.';
        msgEl.className = 'msg success show';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Report Submitted';
        sightingForm.querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);
      });
    }
  }
})();

/* ---------- SITE TYPOGRAPHY RULE: no stranded sentence openings ----------
   Founder rule 2026-09-10, from a real case on the live page: the sentence
   "Every mod, every part..." began at the end of a line with only the word
   "Every" fitting, and the rest ran on below. A sentence must never start a
   line-end with fewer than three of its words; the fragment moves down whole.

   Mechanism: bind the first three words of every sentence after the first
   with non-breaking spaces. The space BEFORE the sentence stays breakable, so
   if all three do not fit, all three wrap together and nothing is stranded.
   Layout-independent — no re-run needed on resize, and no reflow cost.

   Guard: skipped when those three words exceed 26 characters, since forcing a
   long group onto one line could overflow a narrow phone. Wrapping ugly beats
   overflowing.                                                              */
(function () {
  const MIN_WORDS = 3, MAX_CHARS = 26;

  function typeset(el) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let n;
    while ((n = walker.nextNode())) nodes.push(n);

    // Flatten to one string, remembering which node/offset each char came from,
    // so inline markup (<strong>, <a>) survives untouched.
    let full = '';
    const map = [];
    for (const nd of nodes) {
      for (let i = 0; i < nd.textContent.length; i++) map.push({ node: nd, offset: i });
      full += nd.textContent;
    }

    const bind = [];
    const boundary = /[.!?]["')\]]?\s+/g;
    let m;
    while ((m = boundary.exec(full))) {
      let cursor = m.index + m[0].length;      // first char of the next sentence
      if (cursor >= full.length) continue;

      const spaces = [];
      let words = 0, chars = 0, ended = false;
      while (cursor < full.length && words < MIN_WORDS) {
        const start = cursor;
        while (cursor < full.length && !/\s/.test(full[cursor])) cursor++;
        chars += cursor - start;
        words++;
        // Never bind across a sentence end. Fix 2026-09-22: back-to-back short
        // sentences ("What suspension? What bumper? What light bar") chained
        // their bindings into one unbreakable run that overflowed a phone.
        if (/[.!?]["')\]]?$/.test(full.slice(start, cursor))) { ended = true; break; }
        if (words < MIN_WORDS) {
          if (full[cursor] === ' ') { spaces.push(cursor); chars++; cursor++; }
          else break;                          // ran out of sentence
        }
      }
      if ((words === MIN_WORDS || ended) && spaces.length && chars <= MAX_CHARS) bind.push(...spaces);
    }

    // One char replaced by one char, so recorded offsets stay valid.
    const NBSP = String.fromCharCode(160);   // explicit: an invisible literal is fragile
    for (const i of bind) {
      const { node, offset } = map[i];
      const t = node.textContent;
      node.textContent = t.slice(0, offset) + NBSP + t.slice(offset + 1);
    }
  }

  window.bbTypeset = function (root) { (root || document).querySelectorAll('p, li, .hint, .sub, .lead, .qr-hint, .empty-state, .cta-text, .info-value').forEach(typeset); };
  window.bbTypeset();
})();
